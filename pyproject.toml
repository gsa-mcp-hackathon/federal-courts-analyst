[project]
name = "courts-analyst"
version = "0.1.0"
description = "Federal Courts Analyst: an edition-aware MCP server for federal court workload statistics"
readme = "README.md"
# 3.11 floor keeps the template's deploy targets (Databricks Apps, cloud.gov
# buildpack) working; we develop and ship the container on 3.12.
requires-python = ">=3.11"
dependencies = [
    # 4.x speaks MCP 2026-07-28 and still negotiates 2025-11-25 clients.
    # See docs/adr/0001-mcp-capabilities.md before changing this pin.
    "fastmcp>=4.0.10,<5",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    # The server reads the DuckDB catalog and IDB (P4) and YAML registries
    # (measures, glossary, judgeship thresholds, question bank).
    "duckdb>=1.1",
    "pyyaml>=6.0",
    # P7: REST + SSE agent stream in the same container. FastMCP 4 needs
    # Starlette >= 1.0.1; uvicorn comes with FastMCP.
    "fastapi>=0.133",
    # P7: the agent's default model provider (the OpenAI adapter needs the
    # eval group). Spans go through the OpenTelemetry API (FastMCP pulls it in).
    "anthropic>=1.0",
    "opentelemetry-api>=1.30",
]

[project.scripts]
# Lets you run the server with `uv run courts-analyst`.
courts-analyst = "courts_analyst.app:main"
# The evaluation harness (P3): `uv run courts-eval run --answerer gold`.
courts-eval = "courts_analyst.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courts_analyst"]

[dependency-groups]
# `make setup` installs dev only. Other groups are pulled in by the phase that
# needs them (`uv sync --group pipeline`, etc.).
dev = [
    "httpx>=0.27",
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "syrupy>=4.8",
    "types-openpyxl>=3.1",
    "types-pyyaml>=6.0",
    # Agent span tests (in-memory exporter).
    "opentelemetry-sdk>=1.30",
]
# P1/P2: official tables scraper and IDB loader.
pipeline = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
]
# P7: export agent spans to Phoenix over OTLP (`uv sync --group otel`, then
# set OTEL_EXPORTER_OTLP_ENDPOINT).
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]
# P3/P10: benchmark harness. The harness itself needs only the runtime deps;
# the model SDKs are for the paid API answerers (`uv sync --group eval`).
eval = [
    "anthropic>=1.0",
    "openai>=2.0",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "PTH", # prefer pathlib
]
ignore = [
    "RUF001", # ambiguous unicode in strings (we use en dashes and arrows in text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The template's Databricks eval kit is vendored; lint it lightly.
"eval/databricks/**" = ["E402", "E501", "B", "UP", "SIM", "RUF", "PTH"]
"deploy/**" = ["PTH", "RUF100"]
# Test fixtures quote real URLs, HTML and SQL verbatim.
"tests/**" = ["E501"]

[tool.bandit]
# B101: asserts narrow types (mypy); they never guard security.
# B608: SQL is built from constant fragments with ? parameters only;
#       tests/test_sql_safety.py enforces that on the syntax tree.
skips = ["B101", "B608"]
exclude_dirs = ["tests", ".venv"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["courts_analyst"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# Domain logic and shared models are fully typed.
[[tool.mypy.overrides]]
module = ["courts_analyst.core", "courts_analyst.models"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not fulldata and not docker' --strict-markers"
markers = [
    "fulldata: needs the full downloaded datasets; run locally or nightly (make test-full)",
    "docker: runs against the local Docker container",
]
filterwarnings = [
    "error::DeprecationWarning:courts_analyst.*",
    # AO workbooks often lack a default style; openpyxl copes and says so.
    "ignore:Workbook contains no default style:UserWarning",
]

[tool.coverage.run]
source = ["courts_analyst"]
branch = true
# Measure the server subprocesses started by tests/test_transport.py too.
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
