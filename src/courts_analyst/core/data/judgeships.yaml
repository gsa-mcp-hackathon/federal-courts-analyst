# Judgeship reference data for judgeship_context (core/judgeships.py).
#
# Everything here is quoted from a published source and tagged with it. The
# server reports these facts next to the official weighted filings; it never
# makes a recommendation of its own. Review: issue #5 (domain expert).

thresholds:
  - id: new_judgeship_standard
    value: 430
    measure: weighted_total_filings_per_judgeship
    label: Judicial Conference standard for considering an additional district judgeship
    description: >-
      The Judicial Conference's starting point for the district courts is 430
      weighted filings per authorized judgeship after accounting for the
      judgeships it recommends; it generally requires a court to be above 430
      to recommend an additional judgeship. It also weighs other factors
      (senior and magistrate judge assistance, geography, case mix), so
      crossing 430 is not by itself a recommendation.
    source: >-
      CRS Insight IN12541, "Recommendation for New U.S. Circuit and District
      Court Judgeships by the Judicial Conference of the United States (119th
      Congress)"; AO, "Judiciary Makes the Case for New Judgeships" (2020)
    url: https://www.congress.gov/crs-product/IN12541
  - id: judicial_emergency_vacancy_600
    value: 600
    measure: weighted_total_filings_per_judgeship
    label: Judicial emergency threshold (with a vacancy)
    description: >-
      A district court vacancy is a judicial emergency when weighted filings
      exceed 600 per judgeship; a vacancy open more than 18 months is an
      emergency when weighted filings are 430 to 600 per judgeship; so is a
      court with more than one authorized judgeship and only one active judge.
      The definition needs vacancy data, which this server doesn't have, so it
      can report the filings side only.
    source: Administrative Office of the U.S. Courts, "Judicial Emergency Definition"
    url: https://www.uscourts.gov/judicial-emergency-definition

