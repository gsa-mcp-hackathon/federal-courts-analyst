# Measure definitions for the official-tables catalog.
#
# One entry per measure_id. Table parsers map printed column headers to these
# ids (pipeline/tables/families.py). The same id in two tables means "the
# judiciary publishes this statistic in both", which is what lets the revision
# view line up, say, JB-2020 X-1A against JFF-2023 6.2.
#
# Keep definitions factual and sourced from the tables' own notes. Anything we
# infer (for example, why a series was revised) belongs in docs/, labelled as
# inference, not here.
#
# Fields: label, definition, unit, weighted (bool), denominator (or null),
#         decimals (display precision used by tools), tables (which
#         published tables print it), idb (the IDB rule that rebuilds it, for
#         reconciliation: filed | terminated | pending), scope notes.
#
# The official tables are authoritative for every measure here. The IDB only
# reconstructs counts (for reconcile, explain_change and cohorts); it never
# replaces a published figure.

authorized_judgeships:
  label: Authorized judgeships
  definition: >-
    Number of authorized Article III district judgeships used as the
    denominator for per-judgeship figures. Territorial courts are excluded
    in Table X-1A; Table 6.2 notes that 1990–2011 counts include them.
    Districts that share a judgeship show halves (E.D. Ky. 5.5).
  unit: judgeships
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.2', X-1A]

authorized_judgeships_incl_territorial:
  label: Authorized judgeships (including territorial courts)
  definition: >-
    Authorized district judgeships as printed in Judicial Facts and Figures
    Table 6.1, which counts the territorial courts (Guam, Northern Mariana
    Islands, Virgin Islands) as well as Article III districts.
  unit: judgeships
  weighted: false
  denominator: null
  decimals: 0
  tables: ['6.1']

# ── Filings per authorized judgeship (X-1A, 6.2) ───────────────────────────
civil_filings_per_judgeship:
  label: Civil filings per judgeship (unweighted)
  definition: >-
    Civil cases filed divided by authorized judgeships. Excludes civil cases
    reopened, remanded, or transferred to the district by order of the
    Judicial Panel on Multidistrict Litigation.
  unit: filings per judgeship
  weighted: false
  denominator: authorized_judgeships
  decimals: 0
  tables: ['6.2', X-1A]
weighted_civil_filings_per_judgeship:
  label: Weighted civil filings per judgeship
  definition: >-
    Civil filings multiplied by Federal Judicial Center case weights (which
    reflect the relative judge time each case type needs), divided by
    authorized judgeships. The Judicial Conference uses weighted filings when
    assessing judgeship needs.
  unit: weighted filings per judgeship
  weighted: true
  denominator: authorized_judgeships
  decimals: 0
  tables: ['6.2', X-1A]
criminal_filings_per_judgeship:
  label: Criminal filings per judgeship (unweighted)
  definition: >-
    Criminal defendants filed divided by authorized judgeships. Table X-1A
    counts felony and Class A misdemeanor defendants (and petty-offense
    defendants assigned to district judges) and excludes remands and reopens;
    Table 6.2 notes that its criminal filings include reopens and transfers.
  unit: filings per judgeship
  weighted: false
  denominator: authorized_judgeships
  decimals: 0
  tables: ['6.2', X-1A]
weighted_criminal_filings_per_judgeship:
  label: Weighted criminal filings per judgeship
  definition: Criminal defendant filings multiplied by FJC case weights, divided by authorized judgeships.
  unit: weighted filings per judgeship
  weighted: true
  denominator: authorized_judgeships
  decimals: 0
  tables: ['6.2', X-1A]
supervision_hearings_per_judgeship:
  label: Supervised release hearings per judgeship (unweighted)
  definition: Supervised release and probation revocation hearings divided by authorized judgeships.
  unit: hearings per judgeship
  weighted: false
  denominator: authorized_judgeships
  decimals: 1
  tables: ['6.2', X-1A]
weighted_supervision_hearings_per_judgeship:
  label: Weighted supervised release hearings per judgeship
  definition: >-
    Supervised release hearings multiplied by FJC case weights, divided by
    authorized judgeships. Included in weighted totals beginning in 2002.
  unit: weighted hearings per judgeship
  weighted: true
  denominator: authorized_judgeships
  decimals: 1
  tables: ['6.2', X-1A]
total_filings_per_judgeship:
  label: Total filings per judgeship (unweighted)
  definition: Civil filings plus criminal defendants plus supervised release hearings, divided by authorized judgeships.
  unit: filings per judgeship
  weighted: false
  denominator: authorized_judgeships
  decimals: 0
  tables: ['6.2', X-1A]
weighted_total_filings_per_judgeship:
  label: Weighted total filings per judgeship
  definition: >-
    Weighted civil plus weighted criminal plus weighted supervised release
    hearings, divided by authorized judgeships. The Judicial Conference
    generally considers new judgeships above 430 and treats above 600 as a
    judicial emergency threshold (see CRS Insight IN12541).
  unit: weighted filings per judgeship
  weighted: true
  denominator: authorized_judgeships
  decimals: 0
  tables: ['6.2', X-1A]

# ── Civil caseload (C-1) ───────────────────────────────────────────────────
civil_cases_filed:
  label: Civil cases filed
  definition: Civil cases commenced in the 12-month period (Table C-1, all civil cases).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
  idb: filed
civil_cases_terminated:
  label: Civil cases terminated
  definition: Civil cases terminated in the 12-month period (Table C-1).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
  idb: terminated
civil_cases_pending:
  label: Civil cases pending
  definition: >-
    Civil cases pending at the end of the period (Table C-1). Includes cases
    transferred to the district under a Multidistrict Litigation order.
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
  idb: pending
us_civil_cases_filed:
  label: U.S. civil cases filed
  definition: Civil cases filed in which the United States is a party (plaintiff or defendant).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
us_civil_cases_terminated:
  label: U.S. civil cases terminated
  definition: Civil cases terminated in which the United States is a party.
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
us_civil_cases_pending:
  label: U.S. civil cases pending
  definition: Civil cases pending in which the United States is a party.
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
private_civil_cases_filed:
  label: Private civil cases filed
  definition: Civil cases filed between private parties (federal question, diversity, local jurisdiction).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
private_civil_cases_terminated:
  label: Private civil cases terminated
  definition: Civil cases between private parties terminated in the period.
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]
private_civil_cases_pending:
  label: Private civil cases pending
  definition: Civil cases between private parties pending at the end of the period.
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-1]

# ── Total caseload, civil + criminal (6.1) ─────────────────────────────────
total_cases_filed:
  label: Total civil and criminal cases filed
  definition: Civil and criminal cases filed, including transfers (Judicial Facts and Figures Table 6.1).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: ['6.1']
total_cases_terminated:
  label: Total civil and criminal cases terminated
  definition: Civil and criminal cases terminated, including transfers (Table 6.1).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: ['6.1']
total_cases_pending:
  label: Total civil and criminal cases pending
  definition: Civil and criminal cases pending at period end, including transfers (Table 6.1).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: ['6.1']

# ── Time to disposition (C-5, 6.3) ─────────────────────────────────────────
civil_cases_terminated_for_median:
  label: Civil cases in the disposition-time base
  definition: >-
    Civil cases terminated that enter the median-time calculation (Table C-5).
    Excludes land condemnations, prisoner petitions, deportation reviews,
    recovery of overpayments and enforcement of judgments.
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-5]
civil_median_months_to_disposition:
  label: Median time from filing to disposition, civil (months)
  definition: >-
    Median months from filing to disposition for civil cases terminated.
    Not computed when fewer than 10 cases are reported.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3', C-5]
civil_cases_no_court_action:
  label: Civil cases terminated with no court action
  definition: Civil cases terminated with no court action (Table C-5).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-5]
civil_median_months_no_court_action:
  label: Median time to disposition, civil, no court action (months)
  definition: Median months from filing to disposition for civil cases terminated with no court action.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3', C-5]
civil_cases_court_action_before_pretrial:
  label: Civil cases terminated by court action before pretrial
  definition: Civil cases terminated by court action before a pretrial conference (Table C-5).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-5]
civil_median_months_court_action_before_pretrial:
  label: Median time to disposition, civil, court action before pretrial (months)
  definition: Median months for civil cases terminated by court action before pretrial.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3', C-5]
civil_cases_court_action_during_after_pretrial:
  label: Civil cases terminated by court action during or after pretrial
  definition: Civil cases terminated by court action during or after pretrial (Table C-5).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-5]
civil_median_months_court_action_during_after_pretrial:
  label: Median time to disposition, civil, during or after pretrial (months)
  definition: Median months for civil cases terminated by court action during or after pretrial.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3', C-5]
civil_cases_court_action_trial:
  label: Civil cases terminated during or after trial
  definition: Civil cases terminated during trial (Table C-5).
  unit: cases
  weighted: false
  denominator: null
  decimals: 0
  tables: [C-5]
civil_median_months_court_action_trial:
  label: Median time to disposition, civil, trial (months)
  definition: Median months from filing to disposition for civil cases terminated during trial.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3', C-5]
criminal_median_months_to_disposition:
  label: Median time from filing to disposition, criminal defendants (months)
  definition: >-
    Median months for criminal defendants. From March 2012 measured from the
    proceeding date to acquittal or sentencing; earlier periods are not
    comparable (Table 6.3 note).
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3']
criminal_median_months_dismissed:
  label: Median time to disposition, criminal, dismissed (months)
  definition: Median months for criminal defendants whose cases were dismissed.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3']
criminal_median_months_guilty_plea:
  label: Median time to disposition, criminal, guilty plea (months)
  definition: Median months for criminal defendants who pleaded guilty.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3']
criminal_median_months_bench_trial:
  label: Median time to disposition, criminal, bench trial (months)
  definition: Median months for criminal defendants disposed of by bench trial.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3']
criminal_median_months_jury_trial:
  label: Median time to disposition, criminal, jury trial (months)
  definition: Median months for criminal defendants disposed of by jury trial.
  unit: months
  weighted: false
  denominator: null
  decimals: 1
  tables: ['6.3']
