# NOS — nature of suit (3-digit statistical code).
# Source: FJC IDB Civil Codebook 1988 Forward (2023-10-25), pp. 3–4.
#
# category / group / line place each code in the hierarchy of the official
# Table C-2 ("Civil Cases Commenced, by Basis of Jurisdiction and Nature of
# Suit"), transcribed from JB-2024 C-2 (jb_c2_0930.2024.xlsx):
#   category  C-2's top-level totals (Contract, Real Property, Tort, Statutes)
#   group     the next level (a C-2 "Total" row, or the row itself)
#   line      the finest C-2 row the code is counted in
# Checked against JB-2024 C-2: FY2024 IDB filings by category and group agree
# within 0.4% for every group (see docs/methodology/idb.md). Codes marked
# `unverified` are too few to confirm their row that way.
#
# Codes marked `discontinued` are not in the 2023 codebook but still occur in
# older records; their labels come from the C-2 row names and the JS 44 civil
# cover sheet.
field: nos
column: NOS
title: Nature of suit
description: Statistical code for the nature of the action filed.
missing: ["-8"]
