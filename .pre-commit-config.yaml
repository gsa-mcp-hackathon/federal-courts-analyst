# Install with `make setup` (runs `pre-commit install`).
# Hooks use the project's own tool versions via `uv run`, so they match CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
        exclude: ^deploy/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        # Whole-package run: mypy is fast here and per-file runs miss
        # cross-module errors.
        entry: uv run mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
