# Golden official figures (Phase 1).
#
# Each entry is a value exactly as printed in one edition of one uscourts.gov
# table. tests/test_golden_figures.py checks that the catalog built from the
# committed fixtures returns this value (rounded half-up at the printed
# precision) for this measure, court, fiscal year AND edition.
#
# Verification: every value was read from the catalog and independently
# matched against the PDF text of the same edition (a path that does not use
# the table parsers). The six concept-document figures were also checked by
# eye against the xlsx and PDF. A second person still needs to double-check
# the list (plan/phase-01, open issue).
#
# `cell` is where the catalog read the number (xlsx sheet!cell or PDF
# page/line/column); `source` is the published file.
