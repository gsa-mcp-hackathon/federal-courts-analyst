# explanation suite — "why" questions scored by rule-based claims, never by an
# LLM judge. Claims name the facts a correct explanation must contain; the
# contributions behind them were computed from the IDB (release 2026-08-26)
# and the official tables (see notes). Phrase lists accept the usual spellings.
- id: why-fy2020-civil-filings-jump
  question: Why did federal civil filings jump in FY2020?
  claims:
    - id: names_ndfla
      kind: mentions
      any: [Northern District of Florida, N.D. Fla, N.D. Florida, FL-N, "Florida, Northern"]
    - id: names_mdl
      kind: mentions
      any: [MDL, multidistrict]
    - id: notes_direct_filing
      kind: mentions
      any: [directly filed, direct filing, filed directly, direct-filed, direct filed, directly-filed]
    - id: names_earplug_or_3m
      kind: mentions
      any: [3M, earplug, Combat Arms]
  expected_tools: [explain_change]
  tags: [smoke, demo, fy2020, mdl, change]
  notes: >-
    IDB: FY2019→FY2020 filings +173,239; N.D. Fla. +199,881, of which 200,570 more
    direct-filed MDL cases (MDL 2885, 3M Combat Arms earplugs).
- id: why-fy2020-weighted-revised
  question: Why are there two official figures, 554 and 322, for FY2020 weighted civil filings per judgeship?
  claims:
    - id: names_both_editions
      kind: mentions
      all: [JB-2020]
      any: [JFF-2023, JFF-2024, JFF-2025, Judicial Facts and Figures]
    - id: says_revised
      kind: mentions
      any: [revised, revision, restated]
    - id: labels_inference
      kind: mentions
      any: [inferred, inference, not official, unconfirmed, not confirmed, no published note, not explained]
    - id: names_ndfla
      kind: mentions
      any: [Northern District of Florida, N.D. Fla, N.D. Florida, FL-N]
  expected_tools: [get_official_figure]
  acceptable_tools: [explain_change]
  tags: [demo, fy2020, edition_trap, weighted]
  notes: >-
    Nothing published explains the JFF-2023 revision; the MDL explanation must be
    labelled as inference (concept document; issue #8).
- id: why-fy2021-civil-filings-fell
