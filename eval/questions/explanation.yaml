- id: t2-explain-median-time
  split: test2
  question: How is the median time to disposition for civil cases calculated, and which cases are left out?
  claims:
  - id: mentions_terminated
    kind: mentions
    any:
    - terminated
    - closed
    - disposed
    - disposition
  - id: mentions_exclusion
    kind: mentions
    any:
    - prisoner petition
    - land condemnation
    - deportation
    - recovery of overpayment
    - enforcement of judgment
  expected_tools:
  - explain_term
  tags:
  - definition
  - glossary
  notes: 'Glossary: median months from filing to disposition for cases terminated in the period; land condemnations,
    prisoner petitions, deportation reviews, recovery of overpayments and enforcement of judgments excluded.'
- id: t2-explain-termination
  split: test2
  question: What counts as a terminated civil case in these statistics?
  claims:
  - id: mentions_dispositions
    kind: mentions
    any:
    - dismiss
    - judgment
    - transfer
    - remand
    - statistical closing
  expected_tools:
  - explain_term
  tags:
  - definition
  - glossary
  notes: 'Glossary: closed in the period by any disposition (dismissal, judgment, transfer, remand, statistical
    closing); a reopened case counts each time.'
