- id: why-fy2017-pending-restated
  question: The FY2017 national civil pending count is 339,131 in one table and 366,195 in another. Why?
  claims:
    - id: names_jb2017
      kind: mentions
      any: [JB-2017, Judicial Business 2017]
    - id: names_jb2018
      kind: mentions
      any: [JB-2018, Judicial Business 2018]
    - id: says_restated
      kind: mentions
      any: [revised, restated, updated, later edition, prior-year, prior year]
  expected_tools: [get_official_figure]
  acceptable_tools: [reconcile]
  tags: [smoke, edition_trap, pending]
  notes: >-
    JB-2018 Table C-1 prints the FY2017 closing pending count as 366,195 (vs 339,131 in
    JB-2017). The IDB reconstruction lands near the restated figure (issue #11).
