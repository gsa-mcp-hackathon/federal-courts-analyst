- id: adv-latest-each-year-change
  question: Using the latest published figure for each year, how did national weighted civil filings per judgeship change from FY2019 to FY2020?
  expected:
    figures:
      - value: 332
        edition: JFF-2023
        ref: {measure: weighted_civil_filings_per_judgeship, court: US, fiscal_year: 2019, edition: JFF-2023}
      - value: 322
        edition: [JFF-2023, JFF-2024, JFF-2025]
        ref: {measure: weighted_civil_filings_per_judgeship, court: US, fiscal_year: 2020, edition: JFF-2025}
    must_mention_revision: true
  claims:
    - id: no_spliced_change
      kind: not_mentions
      any: ["-59", "−59", "fell by 59", "dropped by 59", "down 59"]
  expected_tools: [get_official_figure]
  acceptable_tools: [explain_change]
  tags: [edition_trap, mixing, revised]
  notes: 381 (JB-2019) against 322 (JFF-2025) would splice the first-published and revised series; the revised series gives 332 → 322.
